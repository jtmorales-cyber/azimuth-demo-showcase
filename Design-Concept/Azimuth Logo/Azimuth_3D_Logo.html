<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystalline Bearing — Azimuth 3D Logo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar {
            width: 320px; flex-shrink: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20,20,19,0.1);
            overflow-y: auto; overflow-x: hidden;
        }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4; }
        .control-section { margin-bottom: 32px; }
        .control-section h3 {
            font-size: 16px; font-weight: 600; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .control-section h3::before { content: '\2022'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input {
            width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px;
            font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray); text-align: center;
        }
        .seed-input:focus { outline: none; border-color: var(--anthropic-orange); box-shadow: 0 0 0 2px rgba(217,119,87,0.1); background: white; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] {
            flex: 1; height: 4px; background: var(--anthropic-light-gray);
            border-radius: 2px; outline: none; -webkit-appearance: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            background: var(--anthropic-orange); border-radius: 50%; cursor: pointer;
        }
        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px; background: var(--anthropic-orange);
            border-radius: 50%; border: none; cursor: pointer;
        }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right; }
        .button {
            background: var(--anthropic-orange); color: white; border: none;
            padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.2s ease; width: 100%;
        }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container {
            width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(20,20,19,0.1); background: #0A0E1A;
        }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); padding: 200px 0; }
        @media (max-width: 600px) { .container { flex-direction: column; } .sidebar { width: 100%; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Crystalline Bearing</h1>
            <div class="subtitle">The Azimuth logomark as a three-dimensional navigational instrument</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">&#8592; Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next &#8594;</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">&#8635; Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>
                <div class="control-group">
                    <label>Rotation Speed</label>
                    <div class="slider-container">
                        <input type="range" id="rotSpeed" min="0.05" max="1.5" step="0.05" value="0.20" oninput="updateParam('rotSpeed', this.value)">
                        <span class="value-display" id="rotSpeed-value">0.20</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Extrusion Depth</label>
                    <div class="slider-container">
                        <input type="range" id="depth" min="10" max="80" step="2" value="56" oninput="updateParam('depth', this.value)">
                        <span class="value-display" id="depth-value">56</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Glow Intensity</label>
                    <div class="slider-container">
                        <input type="range" id="glow" min="0" max="1.5" step="0.1" value="0.5" oninput="updateParam('glow', this.value)">
                        <span class="value-display" id="glow-value">0.5</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Star Density</label>
                    <div class="slider-container">
                        <input type="range" id="starCount" min="50" max="500" step="25" value="225" oninput="updateParam('starCount', this.value)">
                        <span class="value-display" id="starCount-value">225</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Tilt Angle</label>
                    <div class="slider-container">
                        <input type="range" id="tilt" min="0" max="35" step="1" value="12" oninput="updateParam('tilt', this.value)">
                        <span class="value-display" id="tilt-value">12&deg;</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Compass Ring</label>
                    <div class="slider-container">
                        <input type="range" id="ringOpacity" min="0" max="100" step="5" value="100" oninput="updateParam('ringOpacity', this.value)">
                        <span class="value-display" id="ringOpacity-value">100%</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Edge Glow</label>
                    <div class="slider-container">
                        <input type="range" id="edgeGlow" min="0" max="100" step="5" value="100" oninput="updateParam('edgeGlow', this.value)">
                        <span class="value-display" id="edgeGlow-value">100%</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="exportImage()">&#8595; PNG</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing Crystalline Bearing...</div>
            </div>
        </div>
    </div>

    <script>
    // ═══════════════════════════════════════════════════════════════
    // PARAMETERS — user's locked preferences as defaults
    // ═══════════════════════════════════════════════════════════════

    let params = {
        seed: 42,
        rotSpeed: 0.20,
        depth: 56,
        glow: 0.5,
        starCount: 225,
        tilt: 12,
        ringOpacity: 100,
        edgeGlow: 100
    };
    let defaultParams = JSON.parse(JSON.stringify(params));

    // ═══════════════════════════════════════════════════════════════
    // CLIPPED GEOMETRY — real voids, no overlay masking
    //
    // All coordinates centered at SVG (250, 236).
    // Band 1: y=60..87 (full-width void through entire A + circle)
    // Band 2: y=110..126 (circle-only void — sunset reflection)
    //
    // The A polygon is split into 3 separate pieces:
    //   A_ABOVE  — top of A down to band 1 top
    //   RIGHT_LEG — right foot below band 1 bottom
    //   LEFT_LEG  — left foot below band 1 bottom
    //
    // The sphere is drawn as 3 latitude segments,
    //   skipping band 1 and band 2 latitude ranges.
    // ═══════════════════════════════════════════════════════════════

    const A_ABOVE = [
        [ 60, -196], [167.76,  60], [ 84.82,  60], [ 10, -120],
        [-10, -120], [-84.82,  60], [-167.76, 60], [-60, -196]
    ];
    // 6 triangles — verified convex fans from v0/v7/v4
    const A_ABOVE_TRI = [
        [0,1,2], [0,2,3],   // right side
        [7,0,3], [7,3,4],   // top bar
        [4,5,6], [4,6,7]    // left side
    ];

    const RIGHT_LEG = [
        [179.12, 87], [225, 196], [107, 196], [81, 135], [116, 135], [96.05, 87]
    ];
    // Split into convex sub-regions to avoid obtuse angles at inner corners
    // Sub A: outer trapezoid [0,1,2,3], Sub B: notch triangle [3,4,5], Sub C: connector [5,0,3]
    const RIGHT_LEG_TRI = [ [0,1,2], [0,2,3], [3,4,5], [5,0,3] ];

    const LEFT_LEG = [
        [-96.05, 87], [-116, 135], [-81, 135], [-107, 196], [-225, 196], [-179.12, 87]
    ];
    // Split into convex sub-regions (mirrored approach)
    // Sub A: outer trapezoid [5,4,3,2], Sub B: notch triangle [2,1,0], Sub C: connector [0,5,2]
    const LEFT_LEG_TRI = [ [5,4,3], [5,3,2], [2,1,0], [0,5,2] ];

    // Sun / sphere
    const SUN_CX = 0, SUN_CY = 66, SUN_R = 68;

    // Sphere latitude angles for 3 visible segments (radians)
    const SEG1 = { t0: -Math.PI/2, t1: -0.08835 };   // top → band1 top
    const SEG2 = { t0:  0.31396,   t1:  0.70372 };   // band1 bot → band2 top
    const SEG3 = { t0:  1.08084,   t1:  Math.PI/2 }; // band2 bot → bottom

    // Brand colors
    const CYAN   = [0, 180, 207];
    const ORANGE = [255, 86, 1];
    const VOID_C = [10, 14, 26];

    // ═══════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════

    let stars = [];
    let time = 0;

    // ═══════════════════════════════════════════════════════════════
    // SETUP
    // ═══════════════════════════════════════════════════════════════

    function setup() {
        let c = createCanvas(800, 800, WEBGL);
        c.parent('canvas-container');
        document.querySelector('.loading').style.display = 'none';
        initializeSystem();
    }

    function initializeSystem() {
        randomSeed(params.seed);
        noiseSeed(params.seed);
        stars = [];
        for (let i = 0; i < 500; i++) {
            stars.push({
                x: random(-600, 600), y: random(-600, 600), z: random(-600, 600),
                sz: random(1, 3.5), br: random(100, 255),
                spd: random(0.3, 1.2), ph: random(TWO_PI)
            });
        }
        time = 0;
    }

    // ═══════════════════════════════════════════════════════════════
    // DRAW
    // ═══════════════════════════════════════════════════════════════

    function draw() {
        background(VOID_C[0], VOID_C[1], VOID_C[2]);
        time += deltaTime * 0.001;

        camera(0, 0, 520, 0, 0, 0, 0, 1, 0);
        perspective(PI / 3, width / height, 1, 2000);

        push();
        scale(0.58);
        translate(0, -10, 0);

        // Stars (world-space, before logo rotation)
        drawStars();

        // Compass ring (independent slow orbit)
        if (params.ringOpacity > 0) drawCompassRing();

        // Tilt + spin
        rotateX(radians(params.tilt));
        rotateY(time * params.rotSpeed);

        // Subtle breathing
        let breath = 1.0 + sin(time * 0.8) * 0.005;
        scale(breath);

        // Lighting rig
        ambientLight(35, 45, 65);
        directionalLight(200, 210, 220, 0.6, -0.4, -1);
        directionalLight(40, 60, 100, -0.5, 0.3, 0.8);

        // Warm point light from sun (glow parameter controls intensity)
        let gi = params.glow;
        pointLight(255 * gi, 170 * gi, 60 * gi, SUN_CX, SUN_CY, 80);
        pointLight(200 * gi, 100 * gi, 30 * gi, SUN_CX, SUN_CY, -80);

        // === RENDER 3D LOGO ===
        drawSection(A_ABOVE,   A_ABOVE_TRI);
        drawSection(RIGHT_LEG, RIGHT_LEG_TRI);
        drawSection(LEFT_LEG,  LEFT_LEG_TRI);

        drawSunSegments();

        if (params.edgeGlow > 0) drawAllEdges();

        pop();
    }

    // ═══════════════════════════════════════════════════════════════
    // POLYGON INSET — shrinks polygon toward interior for side walls
    //   Prevents side wall surfaces from protruding past front/back
    //   face boundaries at sharp inner corners.
    // ═══════════════════════════════════════════════════════════════

    function computeWallVerts(verts, inset) {
        let n = verts.length;
        let result = [];
        for (let i = 0; i < n; i++) {
            let prev = (i - 1 + n) % n;
            let next = (i + 1) % n;

            // Edge vectors arriving at and departing from vertex i
            let dx1 = verts[i][0] - verts[prev][0], dy1 = verts[i][1] - verts[prev][1];
            let len1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
            let dx2 = verts[next][0] - verts[i][0], dy2 = verts[next][1] - verts[i][1];
            let len2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

            // Inward normals for CCW polygon: left perp = (-dy/len, dx/len)
            let inx1 = -dy1 / len1, iny1 = dx1 / len1;
            let inx2 = -dy2 / len2, iny2 = dx2 / len2;

            // Bisector of the two inward normals
            let bx = inx1 + inx2, by = iny1 + iny2;
            let blen = Math.sqrt(bx * bx + by * by);

            if (blen < 0.001) {
                // Parallel edges — offset perpendicular
                result.push([verts[i][0] + inx1 * inset, verts[i][1] + iny1 * inset]);
            } else {
                bx /= blen; by /= blen;
                // Distance along bisector = inset / sin(halfAngle)
                let sinHalf = Math.abs(inx1 * by - iny1 * bx);
                let d = inset / Math.max(sinHalf, 0.25);
                d = Math.min(d, inset * 3); // Cap extreme insets at sharp vertices
                result.push([verts[i][0] + bx * d, verts[i][1] + by * d]);
            }
        }
        return result;
    }

    // ═══════════════════════════════════════════════════════════════
    // EXTRUDED SECTION RENDERER
    //   Front/back faces use ORIGINAL polygon (pixel-perfect edges)
    //   Side walls use INSET polygon (contained behind faces)
    // ═══════════════════════════════════════════════════════════════

    function drawSection(verts, tris) {
        let d = params.depth / 2;
        let dw = d - 0.3;  // Side walls slightly recessed in Z too
        let wv = computeWallVerts(verts, 0.8);

        push();
        noStroke();
        specularMaterial(CYAN[0], CYAN[1], CYAN[2]);
        shininess(60);

        // Front face (original polygon — exact geometry)
        beginShape(TRIANGLES);
        for (let tri of tris) {
            normal(0, 0, 1);
            vertex(verts[tri[0]][0], verts[tri[0]][1], d);
            vertex(verts[tri[1]][0], verts[tri[1]][1], d);
            vertex(verts[tri[2]][0], verts[tri[2]][1], d);
        }
        endShape();

        // Back face (reversed winding, original polygon)
        beginShape(TRIANGLES);
        for (let tri of tris) {
            normal(0, 0, -1);
            vertex(verts[tri[2]][0], verts[tri[2]][1], -d);
            vertex(verts[tri[1]][0], verts[tri[1]][1], -d);
            vertex(verts[tri[0]][0], verts[tri[0]][1], -d);
        }
        endShape();

        // Side walls — inset polygon + recessed Z (fully behind faces)
        beginShape(TRIANGLES);
        for (let i = 0; i < wv.length; i++) {
            let j = (i + 1) % wv.length;
            let v0 = wv[i], v1 = wv[j];
            let dx = v1[0] - v0[0], dy = v1[1] - v0[1];
            let len = Math.sqrt(dx * dx + dy * dy);
            if (len < 0.01) continue;
            let nx = dy / len, ny = -dx / len;

            // Triangle 1
            normal(nx, ny, 0);
            vertex(v0[0], v0[1],  dw);
            normal(nx, ny, 0);
            vertex(v1[0], v1[1],  dw);
            normal(nx, ny, 0);
            vertex(v1[0], v1[1], -dw);

            // Triangle 2
            normal(nx, ny, 0);
            vertex(v0[0], v0[1],  dw);
            normal(nx, ny, 0);
            vertex(v1[0], v1[1], -dw);
            normal(nx, ny, 0);
            vertex(v0[0], v0[1], -dw);
        }
        endShape();

        pop();
    }

    // ═══════════════════════════════════════════════════════════════
    // SPHERE — drawn as 3 partial latitude segments (true voids)
    // ═══════════════════════════════════════════════════════════════

    function drawSunSegments() {
        push();
        noStroke();
        emissiveMaterial(ORANGE[0], ORANGE[1], ORANGE[2]);
        specularMaterial(255, 140, 60);
        shininess(100);

        drawSphereSlice(SEG1.t0, SEG1.t1, 16, 32);  // top cap
        drawSphereSlice(SEG2.t0, SEG2.t1, 8,  32);   // middle ring
        drawSphereSlice(SEG3.t0, SEG3.t1, 6,  32);   // bottom cap

        pop();
    }

    function drawSphereSlice(thetaStart, thetaEnd, latSteps, lonSteps) {
        let r = SUN_R;
        for (let i = 0; i < latSteps; i++) {
            let t1 = thetaStart + (thetaEnd - thetaStart) * i / latSteps;
            let t2 = thetaStart + (thetaEnd - thetaStart) * (i + 1) / latSteps;

            let ct1 = Math.cos(t1), st1 = Math.sin(t1);
            let ct2 = Math.cos(t2), st2 = Math.sin(t2);

            beginShape(TRIANGLE_STRIP);
            for (let j = 0; j <= lonSteps; j++) {
                let phi = TWO_PI * j / lonSteps;
                let cp = Math.cos(phi), sp = Math.sin(phi);

                normal(ct1 * cp, st1, ct1 * sp);
                vertex(SUN_CX + r * ct1 * cp, SUN_CY + r * st1, r * ct1 * sp);

                normal(ct2 * cp, st2, ct2 * sp);
                vertex(SUN_CX + r * ct2 * cp, SUN_CY + r * st2, r * ct2 * sp);
            }
            endShape();
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // CRYSTALLINE EDGE HIGHLIGHTS
    // ═══════════════════════════════════════════════════════════════

    function drawAllEdges() {
        let alpha = params.edgeGlow * 2.55;
        let d = params.depth / 2 + 0.5;

        stroke(0, 220, 240, alpha);
        strokeWeight(1.0);
        noFill();

        drawPolyEdges(A_ABOVE, d);
        drawPolyEdges(RIGHT_LEG, d);
        drawPolyEdges(LEFT_LEG, d);
    }

    function drawPolyEdges(verts, d) {
        // Front outline
        beginShape();
        for (let v of verts) vertex(v[0], v[1], d);
        endShape(CLOSE);
        // Back outline
        beginShape();
        for (let v of verts) vertex(v[0], v[1], -d);
        endShape(CLOSE);
        // Depth connectors
        for (let v of verts) line(v[0], v[1], d, v[0], v[1], -d);
    }

    // ═══════════════════════════════════════════════════════════════
    // STAR FIELD
    // ═══════════════════════════════════════════════════════════════

    function drawStars() {
        let count = Math.min(stars.length, params.starCount);
        for (let i = 0; i < count; i++) {
            let s = stars[i];
            s.x += Math.sin(time * s.spd + s.ph) * 0.12;
            s.y += Math.cos(time * s.spd * 0.7 + s.ph) * 0.09;
            let tw = Math.sin(time * 2.5 + s.ph) * 0.35 + 0.65;
            let b = s.br * tw;

            stroke(b, b * 0.94, b * 0.82);
            strokeWeight(s.sz);
            point(s.x, s.y, s.z);
        }
        noStroke();
    }

    // ═══════════════════════════════════════════════════════════════
    // COMPASS RING
    // ═══════════════════════════════════════════════════════════════

    function drawCompassRing() {
        push();
        let a = params.ringOpacity * 2.55;

        rotateX(radians(params.tilt));
        rotateY(time * 0.07);
        rotateX(HALF_PI);

        let R = 310;
        noFill();

        // Main ring
        stroke(0, 206, 209, a);
        strokeWeight(1.2);
        beginShape();
        for (let i = 0; i <= 180; i++) { let t = TWO_PI * i / 180; vertex(R * Math.cos(t), R * Math.sin(t), 0); }
        endShape();

        // Inner guide
        stroke(0, 206, 209, a * 0.3);
        strokeWeight(0.5);
        beginShape();
        for (let i = 0; i <= 120; i++) { let t = TWO_PI * i / 120; vertex((R - 15) * Math.cos(t), (R - 15) * Math.sin(t), 0); }
        endShape();

        // Cardinal ticks
        stroke(0, 230, 245, a);
        strokeWeight(2.5);
        for (let t = 0; t < TWO_PI; t += HALF_PI) {
            line((R - 14) * Math.cos(t), (R - 14) * Math.sin(t), 0,
                 (R + 14) * Math.cos(t), (R + 14) * Math.sin(t), 0);
        }

        // Minor ticks every 10 deg
        stroke(0, 206, 209, a * 0.5);
        strokeWeight(0.6);
        for (let deg = 0; deg < 360; deg += 10) {
            if (deg % 90 === 0) continue;
            let t = deg * Math.PI / 180;
            let inner = (deg % 30 === 0) ? R - 8 : R - 5;
            let outer = (deg % 30 === 0) ? R + 8 : R + 5;
            line(inner * Math.cos(t), inner * Math.sin(t), 0,
                 outer * Math.cos(t), outer * Math.sin(t), 0);
        }

        pop();
    }

    // ═══════════════════════════════════════════════════════════════
    // UI HANDLERS
    // ═══════════════════════════════════════════════════════════════

    function updateParam(name, value) {
        params[name] = parseFloat(value);
        let display = value;
        if (name === 'tilt') display = value + '\u00B0';
        else if (name === 'ringOpacity' || name === 'edgeGlow') display = value + '%';
        document.getElementById(name + '-value').textContent = display;
    }

    function exportImage() { saveCanvas('azimuth-3d-seed' + params.seed, 'png'); }

    // ═══════════════════════════════════════════════════════════════
    // SEED CONTROLS
    // ═══════════════════════════════════════════════════════════════

    function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }

    function updateSeed() {
        let v = parseInt(document.getElementById('seed-input').value);
        if (v && v > 0) { params.seed = v; initializeSystem(); }
        else updateSeedDisplay();
    }
    function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); }
    function nextSeed() { params.seed++; updateSeedDisplay(); initializeSystem(); }
    function randomSeedAndUpdate() { params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); initializeSystem(); }

    function resetParameters() {
        params = JSON.parse(JSON.stringify(defaultParams));
        ['rotSpeed','depth','glow','starCount','tilt','ringOpacity','edgeGlow'].forEach(f => {
            document.getElementById(f).value = params[f];
            let d = params[f];
            if (f === 'tilt') d += '\u00B0';
            else if (f === 'ringOpacity' || f === 'edgeGlow') d += '%';
            document.getElementById(f + '-value').textContent = d;
        });
        updateSeedDisplay();
        initializeSystem();
    }

    window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
</html>
